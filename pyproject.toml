[project]
name = "dac"
version = "0.1.0"
description = "Ad creative component performance analysis dashboard"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.46,<2",
    "plotly>=5.24,<7",
    "pandas>=2.3,<3",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pyarrow>=20,<23",
    "scipy>=1.11,<2",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
